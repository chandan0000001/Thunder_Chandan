<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac toe</title>
  <style>


  *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
  }
  
  body{
  background:#111;
  color:white;
  min-height:100vh;
  
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
  }
  
  h1{
  font-size:3rem;
  letter-spacing:2px;
  }
  
  #status{
  font-size:1.4rem;
  color:#00d4ff;
  font-weight:bold;
  }
  
  #board{
  display:grid;
  grid-template-columns:repeat(3,120px);
  grid-template-rows:repeat(3,120px);
  gap:10px;
  }
  
  .cell{
  width:120px;
  height:120px;
  
  background:#222;
  border:2px solid #555;
  border-radius:12px;
  
  color:white;
  font-size:3rem;
  font-weight:bold;
  cursor:pointer;
  
  transition:0.25s;
  }
  
  .cell:hover{
  background:#333;
  border-color:#00d4ff;
  transform:scale(1.05);
  }
  
  .cell:active{
  transform:scale(0.95);
  }
  
  .reset{
  margin-top:15px;
  padding:12px 30px;
  
  background:#00d4ff;
  color:black;
  
  border:none;
  border-radius:8px;
  
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
  
  transition:.3s;
  }
  
  .reset:hover{
  background:#00b4d8;
  transform:translateY(-2px);
  }
  
  .reset:active{
  transform:translateY(0);
  }
</style>
</head >
<body style="background-color: black; color: wheat;">

  <h1>Tic Tac Toe</h1>
  <div id="status">Player X's turn</div>

  <div id="board">
    <button class="cell"  id="0" ></button>
    <button class="cell" id="1" ></button>
    <button class="cell" id="2" ></button>
    <button class="cell" id="3" ></button>
    <button class="cell"  id="4"></button>
    <button class="cell" id="5" ></button>
    <button class="cell"  id="6"></button>
    <button class="cell"  id="7"></button>
    <button class="cell"  id="8"></button>
  </div>

  <button class="reset" id="resetbtn">Reset Game</button>
  <script src="./first.js"></script>
</body>
</html>
